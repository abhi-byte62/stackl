version: '3.8'

services:
  # 1. Frontend Web Application (React + Vite + TypeScript)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stacklens-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    networks:
      - stacklens-net

  # 2. Backend REST API & Intelligence Engine (Spring Boot 3)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stacklens-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/stacklens
      - SPRING_DATASOURCE_USERNAME=stacklens_user
      - SPRING_DATASOURCE_PASSWORD=stacklens_secure_pass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    networks:
      - stacklens-net

  # 3. PostgreSQL Database (ACID Store & Scan History)
  postgres:
    image: postgres:16-alpine
    container_name: stacklens-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=stacklens
      - POSTGRES_USER=stacklens_user
      - POSTGRES_PASSWORD=stacklens_secure_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stacklens_user -d stacklens"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stacklens-net

  # 4. Redis Cache & Rate Limiter
  redis:
    image: redis:7.2-alpine
    container_name: stacklens-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stacklens-net

  # 5. RabbitMQ Asynchronous Job Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: stacklens-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stacklens-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  stacklens-net:
    driver: bridge
